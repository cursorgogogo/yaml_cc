<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONL to JSON - Lint, Format & Convert | YAML.cc</title>
    <meta name="description" content="Lint, format JSONL, and convert JSON Lines to JSON array online. Free, private, runs in your browser.">
    <link rel="canonical" href="https://yaml.cc/jsonl-to-json.html">
    <link rel="icon" type="image/x-icon" href="/assets/images/yamllint.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css" type="text/css">
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="text-xl font-bold text-gray-900 hover:text-gray-700">YAML.cc</a>
                <ul class="hidden md:flex space-x-8">
                    <li><a href="/#tools" class="text-gray-600 hover:text-gray-900 transition">YAML → JSON</a></li>
                    <li><a href="jsonl-to-json.html" class="text-gray-900 font-medium">JSONL → JSON</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section id="tools" class="px-3 py-2" style="height: calc(100vh - 64px); display: flex; flex-direction: column;">
            <div class="mx-auto w-full h-full flex flex-col" style="max-width: 100%;">
                <div class="tools-header text-center mb-1.5 flex-shrink-0">
                    <h1 class="tools-page-title text-lg font-bold text-gray-900 mb-0.5">
                        <span class="hidden sm:inline">JSONL to JSON — Lint, Format &amp; Convert</span>
                        <span class="sm:hidden">JSONL → JSON</span>
                    </h1>
                    <div class="tools-privacy inline-flex items-center bg-emerald-50 text-emerald-800 text-xs font-semibold rounded px-2 py-1 max-w-full">
                        <span class="text-left"><span class="font-bold">Privacy:</span><span class="hidden sm:inline"> Offline in your browser.</span><span class="sm:hidden"> Offline. Not uploaded.</span></span>
                    </div>
                </div>
                <div class="tool-layout flex flex-1 gap-3 overflow-hidden min-h-0">
                    <aside class="tool-sidebar flex-shrink-0 bg-white rounded shadow-lg border border-gray-200">
                        <nav class="tool-nav" aria-label="Tool navigation"></nav>
                    </aside>
                    <div class="tool-main bg-white rounded shadow-lg border border-gray-200 flex-1 flex flex-col overflow-hidden min-w-0">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 p-3 flex-1 overflow-hidden">
                            <div class="flex flex-col h-full overflow-hidden">
                                <h3 class="text-sm font-semibold text-gray-900 mb-1.5 flex-shrink-0">Input JSONL</h3>
                                <div class="flex-1 border border-gray-300 rounded overflow-hidden" style="min-height: 0;">
                                    <div id="editor-input" style="width: 100%; height: 100%;"></div>
                                </div>
                                <div class="flex flex-wrap gap-1.5 mt-1.5 flex-shrink-0">
                                    <button type="button" id="lint-btn" class="px-3 py-1.5 bg-gray-100 text-gray-800 rounded hover:bg-gray-200 text-xs font-medium">Lint JSONL</button>
                                    <button type="button" id="format-btn" class="px-3 py-1.5 bg-gray-100 text-gray-800 rounded hover:bg-gray-200 text-xs font-medium">Format JSONL</button>
                                    <button type="button" id="convert-btn" class="px-3 py-1.5 bg-blue-600 text-white rounded hover:bg-blue-700 text-xs font-medium">Convert to JSON</button>
                                    <button type="button" id="clear-btn" class="px-3 py-1.5 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 text-xs font-medium">Clear</button>
                                </div>
                            </div>
                            <div class="flex flex-col h-full overflow-hidden">
                                <h3 class="text-sm font-semibold text-gray-900 mb-1.5 flex-shrink-0">Output</h3>
                                <div class="flex-1 border border-gray-300 rounded bg-gray-50 p-2 overflow-y-auto" style="min-height: 0;">
                                    <div id="result-output" class="font-mono text-gray-800 text-sm"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/ace.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/mode-json.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/theme-monokai.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="tool-shared.js"></script>
    <script src="jsonl-to-json.js"></script>
</body>
</html>
